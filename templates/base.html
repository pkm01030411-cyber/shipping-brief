<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.tagline }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{{ root }}static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3d5e'/%3E%3Cpath d='M6 20h20l-3 5H9z' fill='%23fff'/%3E%3Crect x='11' y='9' width='10' height='9' fill='%23e8c35a'/%3E%3C/svg%3E">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="{{ root }}index.html">
      <span class="brand-mark">⚓</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <nav>
      <a href="{{ root }}index.html">오늘</a>
      <a href="{{ root }}archive.html">지난 브리핑</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">
  <p>{{ site.tagline }} · 요약은 AI가 생성했으며 원문 확인을 권장합니다. 각 기사의 저작권은 해당 매체에 있습니다.</p>
  <p class="muted">빌드 {{ site.built_at }}</p>
</footer>
</body>
</html>
