<!DOCTYPE html>
<html lang="ko" data-root="{{ root }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.tagline }}">
<meta name="theme-color" content="#0f3d5e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111820" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="{{ root }}manifest.json">
<link rel="apple-touch-icon" href="{{ root }}static/icon-192.png">
<link rel="icon" href="{{ root }}static/icon-192.png" type="image/png">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ root }}feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <a class="brand" href="{{ root }}index.html" title="홈">
      <span class="brand-mark">⚓</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <nav>
      <a href="{{ root }}today.html" {% if nav == 'today' %}class="on"{% endif %}>오늘</a>
      <a href="{{ root }}geo.html" {% if nav == 'geo' %}class="on"{% endif %}>정세</a>
      <a href="{{ root }}weekly.html" {% if nav == 'weekly' %}class="on"{% endif %}>주간</a>
      <a href="{{ root }}tags.html" {% if nav == 'tags' %}class="on"{% endif %}>태그</a>
      <a href="{{ root }}scrap.html" {% if nav == 'scrap' %}class="on"{% endif %}>스크랩 <span id="star-count" class="badge"></span></a>
      <a href="{{ root }}archive.html" {% if nav == 'archive' %}class="on"{% endif %}>지난</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">
  <p>{{ site.tagline }} · 요약은 AI가 생성했으며 원문 확인을 권장합니다. 각 기사의 저작권은 해당 매체에 있습니다.</p>
  <p class="muted">빌드 {{ site.built_at }} · 단축키 <kbd>?</kbd></p>
</footer>
<div id="kbd-help" class="kbd-help">
  <b>단축키</b>
  <span><kbd>j</kbd>/<kbd>k</kbd> 다음·이전 기사</span>
  <span><kbd>x</kbd> 읽음</span>
  <span><kbd>s</kbd> 스크랩</span>
  <span><kbd>o</kbd> 원문 열기</span>
  <span><kbd>?</kbd> 닫기</span>
</div>
<script src="{{ root }}static/app.js" defer></script>
</body>
</html>
