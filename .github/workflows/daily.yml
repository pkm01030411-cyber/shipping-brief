name: Daily shipping brief

on:
  schedule:
    # 매일 18:30 KST (= 09:30 UTC). GitHub cron은 UTC 기준. 그날 낮에 올라온 기사를 저녁에 브리핑.
    # GitHub 스케줄러는 지연·누락이 있어 백업 실행을 둔다. 새 기사가 없으면 API를 호출하지 않으므로 비용 중복 없음.
    - cron: "30 9 * * *"     # 18:30 KST
    - cron: "7 11 * * *"     # 20:07 KST (백업 · 늦게 올라온 기사 보충)
    - cron: "13 13 * * *"    # 22:13 KST (백업)
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
    inputs:
      weekly:
        description: "주간 리뷰도 지금 생성 (지난 7일)"
        type: boolean
        default: false
      resummarize:
        description: "오늘 기사 요약을 처음부터 다시 (프롬프트 변경 후)"
        type: boolean
        default: false
      backfill_geo:
        description: "과거 기사에 국제정세 태깅 추가 (정세 대시보드용, 1회)"
        type: boolean
        default: false

permissions:
  contents: write           # data/ 커밋
  pages: write              # GitHub Pages 배포
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, summarize, build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAGS="--weekly-if-monday"
          [ "${{ inputs.weekly }}" = "true" ] && FLAGS="--weekly"
          [ "${{ inputs.resummarize }}" = "true" ] && FLAGS="$FLAGS --resummarize"
          [ "${{ inputs.backfill_geo }}" = "true" ] && FLAGS="$FLAGS --backfill-geo"
          python run.py $FLAGS

      - name: Commit data
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "brief: $(TZ=Asia/Seoul date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
