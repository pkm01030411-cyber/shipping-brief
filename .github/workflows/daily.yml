name: Daily shipping brief

on:
  schedule:
    # 30분마다 점검 — 실제로 무엇을 언제 할지는 config.yaml의 schedule:이 정한다(수집·게재 시각).
    # GitHub 스케줄러가 늦거나 한 번 건너뛰어도 다음 점검에서 밀린 일을 처리한다.
    # 할 일이 없으면 1분 안에 끝나고 커밋·배포하지 않는다.
    - cron: "7,37 * * * *"
  workflow_dispatch:        # Actions 탭의 수동 실행 버튼
    inputs:
      now:
        description: "지금 바로 수집하고 전날 브리핑 게재 (일정 무시)"
        type: boolean
        default: false
      weekly:
        description: "주간 리뷰도 지금 생성 (지난 7일)"
        type: boolean
        default: false
      resummarize:
        description: "최근 게재일 해운물류 요약을 처음부터 다시 (프롬프트 변경 후)"
        type: boolean
        default: false
      eurasia_resummarize:
        description: "최근 게재일 러시아·유라시아 요약을 처음부터 다시"
        type: boolean
        default: false
      backfill_geo:
        description: "과거 기사에 국제정세 태깅 추가 (정세 대시보드용, 1회)"
        type: boolean
        default: false

permissions:
  contents: write           # data/ 커밋
  pages: write              # GitHub Pages 배포
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect / publish (as scheduled)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAGS=""
          [ "${{ inputs.now }}" = "true" ] && FLAGS="$FLAGS --now"
          [ "${{ inputs.weekly }}" = "true" ] && FLAGS="$FLAGS --weekly"
          [ "${{ inputs.resummarize }}" = "true" ] && FLAGS="$FLAGS --resummarize"
          [ "${{ inputs.eurasia_resummarize }}" = "true" ] && FLAGS="$FLAGS --eurasia-resummarize"
          [ "${{ inputs.backfill_geo }}" = "true" ] && FLAGS="$FLAGS --backfill-geo"
          python run.py $FLAGS

      - name: Commit data
        id: commit
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 → 커밋·배포 생략"
            # 수동 실행은 코드·템플릿 변경 반영을 위해 항상 배포
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "brief: $(TZ=Asia/Seoul date '+%F %H:%M')"
            git pull -q --rebase && git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
