name: Probe eurasia sources
on:
  push:
    branches: [probe-eurasia]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests feedparser
      - run: python probe.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out4 && git commit -qm "probe output" && git push
